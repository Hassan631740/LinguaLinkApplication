spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lingualink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration

jwt:
  secret: change-me-to-strong-secret
  expiration-ms: 3600000

server:
  port: 8080
