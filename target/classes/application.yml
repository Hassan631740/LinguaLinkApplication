# Base configuration - common across all environments
# Environment-specific overrides are in application-{profile}.yml files
# Activate a profile using: spring.profiles.active=local|dev|prod
# Default profile is 'local' for development convenience

spring:
  application:
    name: lingualink
  # Default to 'local' profile if not specified
  # Override with: -Dspring.profiles.active=dev|prod or SPRING_PROFILES_ACTIVE=dev|prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  # Spring Data JPA Configuration (common settings)
  jpa:
    # Database Platform
    database-platform: org.hibernate.dialect.MySQLDialect
    database: mysql
    
    # Hibernate Configuration
    hibernate:
      # Use 'validate' with Flyway, or 'update' if not using Flyway
      ddl-auto: validate
      naming:
        # Use physical naming strategy for better control
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        # Use underscore naming for table and column names
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    
    # JPA Properties (common)
    properties:
      hibernate:
        # Use JDBC batch operations for better performance
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        # Connection provider
        connection:
          provider_disables_autocommit: true
        # Query cache (optional, for performance)
        cache:
          use_second_level_cache: false
          use_query_cache: false
    
    # Open EntityManager in View (for lazy loading in web requests)
    open-in-view: false
  
  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

# JWT Configuration (base - can be overridden per environment)
jwt:
  # Value is loaded from .env file (JWT_SECRET) or environment variable
  secret: ${JWT_SECRET:change-me-to-strong-secret-key-minimum-32-characters-long}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # 1 hour in milliseconds

# SpringDoc OpenAPI (Swagger) Configuration (base)
springdoc:
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
