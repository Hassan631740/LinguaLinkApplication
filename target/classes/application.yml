spring:
  application:
    name: lingualink
  
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/lingualink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
    username: root
    password: .hassan.92
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Connection Pool Configuration (HikariCP - default in Spring Boot)
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # Spring Data JPA Configuration
  jpa:
    # Database Platform
    database-platform: org.hibernate.dialect.MySQLDialect
    database: mysql
    
    # Hibernate Configuration
    hibernate:
      # Use 'validate' with Flyway, or 'update' if not using Flyway
      ddl-auto: validate
      naming:
        # Use physical naming strategy for better control
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        # Use underscore naming for table and column names
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    
    # Show SQL queries in console (disable in production)
    show-sql: true
    
    # JPA Properties
    properties:
      hibernate:
        # Format SQL for better readability
        format_sql: true
        # Use JDBC batch operations for better performance
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        # Generate statistics (disable in production)
        generate_statistics: false
        # Connection provider
        connection:
          provider_disables_autocommit: true
        # Query cache (optional, for performance)
        cache:
          use_second_level_cache: false
          use_query_cache: false
    
    # Open EntityManager in View (for lazy loading in web requests)
    open-in-view: false
  
  # Flyway Database Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

# JWT Configuration
jwt:
  secret: change-me-to-strong-secret
  expiration-ms: 3600000

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: on_param
